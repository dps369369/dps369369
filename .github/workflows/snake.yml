name: Generate Snake

on:
  # Run automatically every day at midnight UTC.
  schedule:
    - cron: "0 0 * * *"

  # Allow us to run it manually from the Actions tab.
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    # Give the workflow permission to create/update the output branch.
    permissions:
      contents: write

    steps:
      # Generate the contribution snake.
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: dps369369
          outputs: dist/github-snake.svg

      # Publish the generated SVG to the "output" branch.
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
